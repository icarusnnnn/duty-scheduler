name: Workspace build

on:
  push:
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workspace-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and production builds
    runs-on: ubuntu-latest
    env:
      PORT: "5000"
      BASE_PATH: "/"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Build workspace for production
        run: pnpm -r --if-present run build
